{
    "device.node_id": "opencanary-node",
    "device.name": "honeypot",
    "rdp.enabled": true,
    "rdp.port": 3389,
    "ssh.enabled": true,
    "ssh.port": 22,
    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": {
                    "format": "%(message)s"
                }
            },
            "handlers": {
                "file": {
                    "class": "logging.FileHandler",
                    "filename": "/var/log/opencanary/opencanary.log"
                }
            }
        }
    }
}
